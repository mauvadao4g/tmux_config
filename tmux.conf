# ~/.tmux.conf — configuração focada em TECLADO (sem mouse), estilo vim + tema Catppuccin Mocha

# --- Geral ---
set -g mouse off                 # não usa mouse
set -g base-index 1              # janelas começam no 1
setw -g pane-base-index 1        # painéis começam no 1
set -g renumber-windows on       # renumera janelas ao fechar uma
set -g history-limit 50000       # mais histórico para rolar
set -sg escape-time 10           # resposta rápida da tecla Esc (importante no vim)
set -g focus-events on           # vim/nvim percebem quando o painel ganha foco
set -g detach-on-destroy off     # ao fechar uma sessão, pula para outra em vez de sair do tmux
set -g status-interval 5         # atualiza a barra a cada 5 s (pasta e branch do git)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # cores reais (true color) para o tema
set -as terminal-features ",xterm-256color:usstyle"   # sublinhado ondulado e colorido (erros do LSP no nvim)

# --- Dividir painéis com | e - (abrindo na mesma pasta) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Voltar para a última janela usada: Ctrl+b Tab (o l padrão virou "painel da direita") ---
bind Tab last-window

# --- Mover a janela atual para a esquerda/direita na barra: Ctrl+b < e > (pode repetir) ---
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# --- Navegar entre painéis estilo vim: Ctrl+b e depois h/j/k/l ---
# (sem prefixo, Alt+h/j/k/l vem do plugin vim-tmux-navigator, lá embaixo)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Navegar entre painéis SEM prefixo: Alt + setas ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Redimensionar painéis: Ctrl+b e depois H/J/K/L ou Shift+setas (pode repetir) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 3
bind -r S-Down  resize-pane -D 3

# --- Trocar de janela SEM prefixo: Alt+1..9 ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Modo cópia estilo vim: Ctrl+b [ , v seleciona, Ctrl+v bloco, y copia ---
# (o plugin tmux-yank faz o y mandar para a área de transferência do sistema)
setw -g mode-keys vi
set -g status-keys vi            # teclas vim também no prompt de comando (Ctrl+b :)
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# --- Pesquisar no histórico do painel: Ctrl+b / já entra no modo cópia com a busca aberta ---
bind / copy-mode \; send-keys ?

# --- Ir para qualquer janela de qualquer sessão digitando parte do nome: Ctrl+b F (usa o fzf) ---
bind F display-popup -E -w 70% -h 60% "tmux list-windows -a -F '#{session_name}:#{window_index}  #{window_name}  #{pane_current_path}' | fzf --reverse --prompt='janela> ' | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# --- Abrir um projeto numa sessão própria: Ctrl+b f lista as pastas de @projects_dirs (usa o fzf) ---
# Várias pastas de projetos: separe com ":" (ex.: "~/GITHUB/repositorios:~/trabalho").
set -g @projects_dirs "~/GITHUB/repositorios"
bind f display-popup -E -w 70% -h 60% "~/.local/bin/tmux-projetos"

# --- Git flutuante na pasta atual: Ctrl+b g abre o lazygit (q fecha) ---
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'PATH="$HOME/.local/bin:$PATH"; command -v lazygit >/dev/null && exec lazygit; echo "lazygit não encontrado: rode o install.sh"; read -r _'

# --- Terminal flutuante na pasta atual: Ctrl+b t (fecha ao sair do shell, com exit ou Ctrl+d) ---
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# --- Layout de programação: Ctrl+b D deixa o painel atual em cima (editor) e abre dois
# terminais embaixo, lado a lado, na mesma pasta (testes de um lado, git/servidor do outro) ---
bind D split-window -v -l 30% -c "#{pane_current_path}" \; split-window -h -c "#{pane_current_path}" \; select-pane -U

# --- Digitar em todos os painéis da janela ao mesmo tempo: Ctrl+b S liga/desliga ---
bind S setw synchronize-panes \; display "Sincronizar painéis: #{?pane_synchronized,LIGADO,desligado}"

# --- Recarregar esta config: Ctrl+b r ---
bind r source-file ~/.tmux.conf \; display "Config recarregada!"

# --- Plugins (gerenciados pelo TPM: Ctrl+b I instala, Ctrl+b U atualiza) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Alt+h/j/k/l entre painéis e splits do vim
set -g @plugin 'tmux-plugins/tmux-yank'           # y copia para o clipboard do sistema
set -g @plugin 'tmux-plugins/tmux-cpu'            # números de CPU e RAM da barra de status
set -g @plugin 'laktak/extrakto'                  # Ctrl+b e: pega caminhos, URLs e palavras da tela
set -g @plugin 'tmux-plugins/tmux-resurrect'      # salva/restaura sessões: Ctrl+b Ctrl+s / Ctrl+b Ctrl+r
set -g @plugin 'tmux-plugins/tmux-continuum'      # salva sozinho a cada 15 min (manter por último)

# --- Sessões que sobrevivem a reiniciar o computador ---
set -g @continuum-restore 'on'                    # restaura tudo ao abrir o tmux
set -g @resurrect-capture-pane-contents 'on'      # guarda também o texto que estava nos painéis
set -g @resurrect-strategy-nvim 'session'         # reabre o nvim se houver um Session.vim na pasta

# --- extrakto: Ctrl+b e (o padrão dele, Tab, já é "última janela") ---
# No menu: digite para filtrar, Enter copia, Tab insere no painel, Ctrl+f troca o filtro.
set -g @extrakto_key 'e'

# --- vim-tmux-navigator: Alt no lugar de Ctrl, para não roubar Ctrl+h/j/k/l do shell ---
set -g @vim_navigator_mapping_left  'M-h'
set -g @vim_navigator_mapping_down  'M-j'
set -g @vim_navigator_mapping_up    'M-k'
set -g @vim_navigator_mapping_right 'M-l'
set -g @vim_navigator_mapping_prev  'M-\'          # painel anterior

# --- Tema Catppuccin Mocha ---
# O tema fica fora do TPM (o install.sh baixa) porque precisa carregar ANTES de montar
# a barra, e o tmux-cpu DEPOIS: as opções vêm primeiro, depois o tema, depois a barra.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"              # nome da janela (o padrão é o título do painel)
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %d/%m %H:%M"
# Pasta do painel ativo e, se for um repositório git, a branch
set -g @catppuccin_directory_text " #{b:pane_current_path}#(cd '#{pane_current_path}' 2>/dev/null && git branch --show-current 2>/dev/null | sed 's/^/   /')"
run '~/.tmux/plugins/catppuccin-tmux/catppuccin.tmux'

# --- Barra de status: sessão à esquerda; pasta e branch, CPU, RAM e data/hora à direita ---
set -g status-left-length 100
set -g status-right-length 150
set -g status-left "#{E:@catppuccin_status_session}"
set -g  status-right ""
set -ag  status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"
# Aviso vermelho "SYNC" enquanto a sincronização de painéis (Ctrl+b S) estiver ligada
set -ag  status-right "#{?pane_synchronized,#[fg=#1e1e2e#,bg=#f38ba8#,bold] SYNC ,}"

# --- Inicializa o TPM (manter esta linha no FINAL do arquivo) ---
run '~/.tmux/plugins/tpm/tpm'
